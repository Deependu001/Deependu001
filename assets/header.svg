<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" width="100%" height="100%" fill="none">
  <defs>
    <style>
      @keyframes blinkCursor {
        0%, 49% { opacity: 1; }
        50%, 100% { opacity: 0; }
      }

      @keyframes s1Fade {
        0%, 98% { opacity: 1; }
        100% { opacity: 1; }
      }

      @keyframes whoamiType {
        0%, 4% { opacity: 0; }
        8%, 100% { opacity: 1; }
      }

      @keyframes whoamiAns {
        0%, 10% { opacity: 0; }
        14%, 100% { opacity: 1; }
      }

      @keyframes profileCmd {
        0%, 18% { opacity: 0; }
        24%, 100% { opacity: 1; }
      }

      @keyframes profileOut {
        0%, 28% { opacity: 0; }
        34%, 100% { opacity: 1; }
      }

      @keyframes focusCmd {
        0%, 44% { opacity: 0; }
        50%, 100% { opacity: 1; }
      }

      @keyframes focusOut {
        0%, 54% { opacity: 0; }
        60%, 100% { opacity: 1; }
      }

      @keyframes reconCmd {
        0%, 66% { opacity: 0; }
        72%, 100% { opacity: 1; }
      }

      @keyframes reconOut {
        0%, 76% { opacity: 0; }
        82%, 100% { opacity: 1; }
      }

      @keyframes buildCmd {
        0%, 88% { opacity: 0; }
        92%, 100% { opacity: 1; }
      }

      @keyframes buildOut {
        0%, 94% { opacity: 0; }
        97%, 100% { opacity: 1; }
      }

      .mono {
        font-family: 'Cascadia Code', 'Cascadia Mono', 'Fira Code', 'Consolas', monospace;
      }

      .cursor {
        animation: blinkCursor 0.9s infinite;
      }

      .scene-whoami-cmd { animation: whoamiType 14s ease-in-out infinite; }
      .scene-whoami-ans { animation: whoamiAns 14s ease-in-out infinite; }
      .scene-prof-cmd   { animation: profileCmd 14s ease-in-out infinite; }
      .scene-prof-out   { animation: profileOut 14s ease-in-out infinite; }
      .scene-focus-cmd  { animation: focusCmd 14s ease-in-out infinite; }
      .scene-focus-out  { animation: focusOut 14s ease-in-out infinite; }
      .scene-recon-cmd  { animation: reconCmd 14s ease-in-out infinite; }
      .scene-recon-out  { animation: reconOut 14s ease-in-out infinite; }
      .scene-build-cmd  { animation: buildCmd 14s ease-in-out infinite; }
      .scene-build-out  { animation: buildOut 14s ease-in-out infinite; }
    </style>
  </defs>

  <!-- BACKGROUND -->
  <rect width="960" height="500" fill="#0D1117" rx="6" />

  <!-- WINDOW HEADER -->
  <rect width="960" height="33" fill="#161B22" rx="6" />
  <line x1="0" y1="33" x2="960" y2="33" stroke="#30363D" stroke-width="1" />

  <!-- TITLEBAR CONTROLS & IDENTITY -->
  <text x="18" y="21" class="mono" font-size="13" font-weight="700" fill="#38BDF8">&gt;_</text>
  <text x="40" y="21" class="mono" font-size="12" fill="#E2E8F0">deependu@kali: ~</text>

  <!-- KALI XFCE WINDOW BUTTONS (Top Right) -->
  <line x1="890" y1="18" x2="900" y2="18" stroke="#94A3B8" stroke-width="1.5" />
  <rect x="910" y="12" width="10" height="10" stroke="#94A3B8" stroke-width="1.5" fill="none" />
  <path d="M 930 12 L 940 22 M 940 12 L 930 22" stroke="#F87171" stroke-width="1.5" />

  <!-- SCENE 1 & 2: whoami -->
  <g transform="translate(26, 68)" class="scene-whoami-cmd">
    <text x="0" y="0" class="mono" font-size="14">
      <tspan fill="#388BFD" font-weight="600">deependu@kali</tspan>
      <tspan fill="#718096">:</tspan>
      <tspan fill="#38BDF8">~</tspan>
      <tspan fill="#F0F6FC">$ </tspan>
      <tspan fill="#F0F6FC">whoami</tspan>
    </text>
  </g>
  <g transform="translate(26, 89)" class="scene-whoami-ans">
    <text x="0" y="0" class="mono" font-size="14" fill="#94A3B8">deependu</text>
  </g>

  <!-- SCENE 3: cat profile.txt -->
  <g transform="translate(26, 111)" class="scene-prof-cmd">
    <text x="0" y="0" class="mono" font-size="14">
      <tspan fill="#388BFD" font-weight="600">deependu@kali</tspan>
      <tspan fill="#718096">:</tspan>
      <tspan fill="#38BDF8">~</tspan>
      <tspan fill="#F0F6FC">$ </tspan>
      <tspan fill="#F0F6FC">cat profile.txt</tspan>
    </text>
  </g>
  <g transform="translate(26, 134)" class="scene-prof-out">
    <text x="0" y="0" class="mono" font-size="18" font-weight="700" fill="#FFFFFF">Deependu Mondal</text>
    <text x="0" y="21" class="mono" font-size="14" font-weight="600" fill="#58A6FF">Cybersecurity Engineer</text>
    <text x="0" y="41" class="mono" font-size="13.5" fill="#94A3B8">Offensive Security</text>
    <text x="0" y="59" class="mono" font-size="13.5" fill="#94A3B8">Application Security</text>
    <text x="0" y="77" class="mono" font-size="13.5" fill="#94A3B8">Security Tooling</text>
  </g>

  <!-- SCENE 4: ./current-focus.sh -->
  <g transform="translate(26, 233)" class="scene-focus-cmd">
    <text x="0" y="0" class="mono" font-size="14">
      <tspan fill="#388BFD" font-weight="600">deependu@kali</tspan>
      <tspan fill="#718096">:</tspan>
      <tspan fill="#38BDF8">~</tspan>
      <tspan fill="#F0F6FC">$ </tspan>
      <tspan fill="#F0F6FC">./current-focus.sh</tspan>
    </text>
  </g>
  <g transform="translate(26, 254)" class="scene-focus-out">
    <text x="0" y="0" class="mono" font-size="13.5">
      <tspan fill="#3FB950" font-weight="700">[+] </tspan>
      <tspan fill="#94A3B8">Offensive Security</tspan>
    </text>
    <text x="0" y="19" class="mono" font-size="13.5">
      <tspan fill="#3FB950" font-weight="700">[+] </tspan>
      <tspan fill="#94A3B8">Web &amp; API Security</tspan>
    </text>
    <text x="0" y="38" class="mono" font-size="13.5">
      <tspan fill="#3FB950" font-weight="700">[+] </tspan>
      <tspan fill="#94A3B8">Vulnerability Research</tspan>
    </text>
    <text x="0" y="57" class="mono" font-size="13.5">
      <tspan fill="#3FB950" font-weight="700">[+] </tspan>
      <tspan fill="#94A3B8">Security Tooling</tspan>
    </text>
  </g>

  <!-- SCENE 5: ./recon.sh -->
  <g transform="translate(26, 332)" class="scene-recon-cmd">
    <text x="0" y="0" class="mono" font-size="14">
      <tspan fill="#388BFD" font-weight="600">deependu@kali</tspan>
      <tspan fill="#718096">:</tspan>
      <tspan fill="#38BDF8">~</tspan>
      <tspan fill="#F0F6FC">$ </tspan>
      <tspan fill="#F0F6FC">./recon.sh</tspan>
    </text>
  </g>
  <g transform="translate(26, 353)" class="scene-recon-out">
    <text x="0" y="0" class="mono" font-size="13.5">
      <tspan fill="#E3B341" font-weight="700">[*] </tspan>
      <tspan fill="#94A3B8">initializing reconnaissance [lab.local]...</tspan>
    </text>
    <text x="0" y="19" class="mono" font-size="13.5">
      <tspan fill="#3FB950" font-weight="700">[+] </tspan>
      <tspan fill="#94A3B8">attack surface mapped</tspan>
    </text>
    <text x="0" y="38" class="mono" font-size="13.5">
      <tspan fill="#3FB950" font-weight="700">[+] </tspan>
      <tspan fill="#94A3B8">web endpoints discovered</tspan>
    </text>
    <text x="0" y="57" class="mono" font-size="13.5">
      <tspan fill="#3FB950" font-weight="700">[+] </tspan>
      <tspan fill="#94A3B8">API surface identified</tspan>
    </text>
    <text x="0" y="76" class="mono" font-size="13.5">
      <tspan fill="#3FB950" font-weight="700">[+] </tspan>
      <tspan fill="#94A3B8">analysis complete</tspan>
    </text>
  </g>

  <!-- SCENE 6: ./build_security_tools.sh -->
  <g transform="translate(26, 450)" class="scene-build-cmd">
    <text x="0" y="0" class="mono" font-size="14">
      <tspan fill="#388BFD" font-weight="600">deependu@kali</tspan>
      <tspan fill="#718096">:</tspan>
      <tspan fill="#38BDF8">~</tspan>
      <tspan fill="#F0F6FC">$ </tspan>
      <tspan fill="#F0F6FC">./build_security_tools.sh</tspan>
    </text>
  </g>
  <g transform="translate(26, 471)" class="scene-build-out">
    <text x="0" y="0" class="mono" font-size="14">
      <tspan fill="#3FB950" font-weight="700">[+] </tspan>
      <tspan fill="#94A3B8">ready</tspan>
      <tspan fill="#3FB950" class="cursor">_</tspan>
    </text>
  </g>
</svg>
