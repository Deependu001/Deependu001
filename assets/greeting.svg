<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 350 42" width="350" height="42" fill="none">
  <defs>
    <style>
      @keyframes typeReveal {
        0%, 10% { width: 0px; }
        45%, 90% { width: 335px; }
        98%, 100% { width: 0px; }
      }

      @keyframes cursorWalk {
        0%, 10% { transform: translateX(0px); }
        45%, 90% { transform: translateX(330px); }
        98%, 100% { transform: translateX(0px); }
      }

      @keyframes blinkCursor {
        0%, 49% { opacity: 1; }
        50%, 100% { opacity: 0; }
      }

      .text-base {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', 'Roboto', 'Helvetica Neue', sans-serif;
        font-size: 25px;
        font-weight: 700;
        letter-spacing: -0.2px;
      }

      .typed-clip-rect {
        animation: typeReveal 7.5s steps(24, end) infinite;
      }

      .cursor-bar {
        animation: cursorWalk 7.5s steps(24, end) infinite, blinkCursor 0.75s infinite;
      }

      .text-main {
        fill: #F0F6FC;
      }

      .text-accent {
        fill: #3FB950;
      }

      @media (prefers-color-scheme: light) {
        .text-main {
          fill: #0F172A;
        }
      }
    </style>

    <clipPath id="type-clip">
      <rect x="0" y="0" width="0" height="42" class="typed-clip-rect" />
    </clipPath>
  </defs>

  <!-- Clipped Animated Text -->
  <g clip-path="url(#type-clip)">
    <text x="0" y="30" class="text-base text-main">
      Hi, I&apos;m <tspan class="text-accent">Deependu Mondal</tspan>
    </text>
  </g>

  <!-- Animated Blinking Cursor Bar (Terminal Green) -->
  <g class="cursor-bar">
    <rect x="0" y="10" width="2.5" height="23" fill="#3FB950" rx="1" />
  </g>
</svg>
